name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check document governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/verify-document-governance.mjs

  quality:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run repository quality gate
        run: npm run check

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # E2E 前置构建（与 npm run check 一致的最小集合）：
      # - 插件包 dist：agent server 子进程（tsx 跑 src/cli/main.ts）经 workspace
      #   exports 解析 @opencolorful/plugin-* 到 dist，缺失会导致子进程启动失败；
      # - web/dist：supervisor 静态资源目录，缺失则页面没有可测的 UI。
      - name: Build plugin packages and web client
        run: npm run build:protocol && npm run build:sdk && npm run web:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        working-directory: web
        run: npx playwright test
