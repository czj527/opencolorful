<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenColorful TokUI Spike</title>
<link rel="stylesheet" href="https://unpkg.com/@jboltai/tokui@0.1.8/dist/tokui.css">
<script src="https://unpkg.com/@jboltai/tokui@0.1.8/dist/tokui.umd.js"></script>
</head>
<body>
<h1>OpenColorful TokUI 投影验证</h1>
<p>此页面使用静态事件夹具演示 TokUI 渲染，不连接真实 Server。</p>
<div id="output"></div>
<script>
// 模拟从 OpenColorful Server 接收的平台事件
const testEvents = [
  { type: "tool.started", payload: { toolCallId: "t1", toolName: "search_files" } },
  { type: "tool.delta", payload: { toolCallId: "t1", delta: "正在搜索..." } },
  { type: "tool.completed", payload: { toolCallId: "t1", isError: false } },
  { type: "turn.completed", payload: { turnId: "turn-1" } },
  { type: "error", payload: { message: "演示错误消息" } },
];

// 对应上述事件的 TokUI DSL chunks
const testChunks = [
  '[tool-call id:"t1" name:"search_files" status:running][p "工具调用进行中"][/tool-call]',
  '[p v:muted "正在搜索..."]',
  '[upd id:"t1" status:done]',
  '[callout t:success tx:"Turn 完成"]',
  '[card tt:"错误"][callout t:danger tx:"演示错误消息"][/card]',
];

const container = document.getElementById("output");
const tokui = new TokUI.TokUI({ container });

tokui.startStream();

for (const [i, chunk] of testChunks.entries()) {
  setTimeout(() => {
    tokui.feed(chunk);
  }, i * 800);
}

setTimeout(() => {
  tokui.endStream();
}, testChunks.length * 800 + 100);
</script>
</body>
</html>
